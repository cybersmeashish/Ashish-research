name: Verify week-one order-boundary evidence

on:
  push:
    branches: [main]
    paths:
      - 'weeks/01-system-and-asset-inventory/**'
      - 'tools/week01_*.py'
      - 'tools/verify_week01.py'
      - 'tests/test_week01_*.py'
      - '.github/workflows/verify-week01.yml'
  pull_request:
    paths:
      - 'weeks/01-system-and-asset-inventory/**'
      - 'tools/week01_*.py'
      - 'tools/verify_week01.py'
      - 'tests/test_week01_*.py'
      - '.github/workflows/verify-week01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reproduce recorded results and regression cases
        run: python tools/verify_week01.py --out work/ci-week01
      - name: Retain actual reproduction evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: week01-review-evidence
          path: work/ci-week01/**
          retention-days: 14
